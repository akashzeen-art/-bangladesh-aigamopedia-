[build]
  publish = "."

# Root → Bangla default
[[redirects]]
  from = "/"
  to = "/bn/index.html"
  status = 302

# Bangla routes
[[redirects]]
  from = "/bn"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/bn/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/bn/index.html"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/bn/moreGames.html"
  to = "/moreGames.html"
  status = 200

[[redirects]]
  from = "/bn/myAccount.html"
  to = "/myAccount.html"
  status = 200

[[redirects]]
  from = "/bn/termsAndConditions.html"
  to = "/termsAndConditions.html"
  status = 200

[[redirects]]
  from = "/bn/*"
  to = "/:splat"
  status = 200

# English routes
[[redirects]]
  from = "/en"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en/"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en/index.html"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/en/moreGames.html"
  to = "/moreGames.html"
  status = 200

[[redirects]]
  from = "/en/myAccount.html"
  to = "/myAccount.html"
  status = 200

[[redirects]]
  from = "/en/termsAndConditions.html"
  to = "/termsAndConditions.html"
  status = 200

[[redirects]]
  from = "/en/*"
  to = "/:splat"
  status = 200
